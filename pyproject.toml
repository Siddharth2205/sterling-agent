[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sterling-agent"
version = "0.1.0"
description = "Canadian portfolio analysis agent with Telegram signals"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "finnhub-python>=2.4.20",
    "pytrends>=4.9.2",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "APScheduler>=3.10.4",
    "click>=8.1.7",
    "python-telegram-bot>=20.7",
    "ta>=0.11.0",
]

[project.scripts]
sterling = "sterling.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["sterling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

name: Sterling Paper Trading

# PAUSED 2026-07-27: scheduled paper trading is disabled following edge validation
# (see DIAGNOSIS.md). The composite score showed no predictive edge at the 10–20 day
# horizon this strategy trades on (information coefficient ≈ 0 / slightly negative;
# top-scored names underperformed XIC.TO). Running a live loop on a model with no
# demonstrable edge produces the feeling of discipline without the substance.
# To resume, uncomment the `schedule:` block below.
#
# Three daily runs aligned to TSX market hours (UTC offsets assume no DST adjustment;
# ET is UTC-4 in summer, UTC-5 in winter — cron times are approximate ±1h in winter).
on:
  # schedule:
  #   - cron: '30 13 * * 1-5'   # 09:30 ET — TSX open
  #   - cron: '30 16 * * 1-5'   # 12:30 ET — midday
  #   - cron: '55 19 * * 1-5'   # 15:55 ET — TSX close
  workflow_dispatch:           # manual trigger only (scheduled runs paused)

# Prevent two runs from overlapping (queues, never cancels in progress).
concurrency:
  group: sterling-analyze
  cancel-in-progress: false

# Required so the final commit-and-push step can write to the repo.
permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch full history so git push doesn't conflict with [skip ci] commits
          fetch-depth: 0

      # ── 2. Runtime ─────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Sterling
        run: pip install -e .

      # ── 3. State restore ───────────────────────────────────────────────────
      # notifications.db holds the 4-hour Telegram throttle state.
      # We restore the most recent cache entry so duplicate alerts are suppressed
      # across runs. Cache eviction after 7 days of inactivity is acceptable —
      # the only consequence is a brief burst of re-sent alerts.
      - name: Restore notifications DB
        uses: actions/cache/restore@v4
        with:
          path: data/notifications.db
          key: notifications-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            notifications-db-

      # paper_trades.csv is committed to the repo, so checkout already has the
      # latest version. Pull with rebase to pick up any commits from concurrent
      # runs that squeaked past the concurrency gate.
      - name: Pull latest commits
        run: git pull --rebase origin ${{ github.ref_name }}

      # ── 4. Analysis ─────────────────────────────────────────────────────────
      # Tickers come from the STERLING_WATCHLIST secret (comma-separated).
      # data/portfolio.json stays gitignored — holdings are private.
      - name: Run sterling analyze --paper --notify
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STERLING_WATCHLIST: ${{ secrets.STERLING_WATCHLIST }}
        run: sterling analyze --paper --notify --watchlist-from-env

      # ── 5. State save ──────────────────────────────────────────────────────
      - name: Save notifications DB
        uses: actions/cache/save@v4
        with:
          path: data/notifications.db
          key: notifications-db-${{ github.run_id }}-${{ github.run_attempt }}

      # ── 6. Commit paper log ─────────────────────────────────────────────────
      # paper_trades.csv accumulates across all runs. The [skip ci] tag prevents
      # this commit from triggering another workflow execution.
      - name: Commit paper_trades.csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper_trades.csv
          if git diff --staged --quiet; then
            echo "No new paper trades — nothing to commit."
          else
            git commit -m "chore: paper trades update [skip ci]"
            git push origin ${{ github.ref_name }}
          fi


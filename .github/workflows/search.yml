name: Sterling Autonomous Strategy Search

# Sweeps the 5,832-config grid in time-budgeted batches. A crash is now RETRIED (never
# treated as settled), so the remaining not-yet-scored configs get re-attempted until the
# grid is truly complete; then runs become quick no-ops that just refresh the paper book +
# dashboard. Cadence drops to weekly once the grid is 100% settled (see commit history).
#
# Required repo Secrets (Settings → Secrets and variables → Actions):
#   NASDAQ_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'   # every 6h until the grid is truly complete, then -> weekly
  workflow_dispatch:              # manual "Run workflow" button

permissions:
  contents: write             # to commit the leaderboard back

concurrency:
  group: sterling-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NASDAQ_API_KEY: ${{ secrets.NASDAQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Stop after the campaign ends (Aug 28, 2026)
        run: |
          if [ "$(date -u +%Y%m%d)" -gt "20260828" ]; then
            echo "Campaign over — exiting."; exit 0
          fi

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Restore data cache (bulk + built matrix)
        uses: actions/cache@v4
        with:
          path: |
            data/sharadar_bulk
            data/edgar/edgar_facts.parquet
            data/survivorship_full_features.pkl
            data/experiment_matrix.pkl
          # v3: + factor features (gross profitability, asset growth, margin trend,
          # net issuance) — forces a one-time rebuild
          key: sterling-matrix-v3

      - name: Run one sweep cycle (builds matrix on first run) + Telegram progress
        run: python -m sterling.research experiment -n 500 --budget-min 240 -v

      - name: Refresh the paper book (market-neutral picks)
        if: ${{ always() }}
        run: python -m sterling.research book --no-notify || true

      - name: Rebuild the dashboard data
        if: ${{ always() }}
        run: python -m sterling.research dashboard || true

      - name: Ping Telegram once when the grid hits 100%
        if: ${{ always() }}
        run: python -m sterling.research grid-status || true

      - name: Final report on/after Aug 28
        if: ${{ always() }}
        run: |
          if [ "$(date -u +%Y%m%d)" -ge "20260828" ]; then
            python -m sterling.research experiment-final
          fi

      - name: Commit the leaderboard + dashboard back
        if: ${{ always() }}
        run: |
          git config user.name  "sterling-bot"
          git config user.email "sterling-bot@users.noreply.github.com"
          # Snapshot THIS run's outputs before syncing to the remote. The leaderboard is
          # append-only across many runs; a plain rebase conflicts on the CSV and the old
          # retry loop then looped forever on the unresolved conflict, discarding the work.
          # Instead: reset to remote, UNION our leaderboard rows in (never lose a row), and
          # push — retrying the whole sync on a lost race.
          mkdir -p "$RUNNER_TEMP/out"
          for f in data/experiment_leaderboard.csv data/paper_ledger.csv \
                   docs/dashboard_data.json data/.grid_complete; do
            [ -e "$f" ] && cp "$f" "$RUNNER_TEMP/out/$(basename "$f")" || true
          done
          pushed=0
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin master
            git reset -q --hard origin/master
            # Leaderboard: union our rows with the remote's (order-independent, dedup by config).
            [ -e "$RUNNER_TEMP/out/experiment_leaderboard.csv" ] && \
              python -m sterling.research merge-ledger --other "$RUNNER_TEMP/out/experiment_leaderboard.csv" || true
            # Paper book, dashboard, sentinel: this run's fresh snapshot wins.
            for f in paper_ledger.csv dashboard_data.json .grid_complete; do
              src="$RUNNER_TEMP/out/$f"
              case "$f" in
                dashboard_data.json) dst="docs/$f" ;;
                *) dst="data/$f" ;;
              esac
              [ -e "$src" ] && cp "$src" "$dst" || true
            done
            for f in data/experiment_leaderboard.csv data/paper_ledger.csv \
                     docs/dashboard_data.json data/.grid_complete; do
              [ -e "$f" ] && git add -f "$f" || true
            done
            if git diff --cached --quiet; then echo "nothing to commit"; pushed=1; break; fi
            git commit -q -m "chore: search + dashboard update [skip ci]"
            if git push -q origin HEAD:master; then echo "pushed on attempt $i"; pushed=1; break; fi
            echo "push attempt $i lost a race; re-syncing"; sleep $((RANDOM % 8 + 2))
          done
          [ "$pushed" = 1 ] || { echo "::error::could not push after retries"; exit 1; }
